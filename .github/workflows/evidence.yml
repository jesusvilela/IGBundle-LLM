name: Bounded evidence checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      DISABLE_TORCHAO: "1"
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evidence arithmetic and scoring contracts (stdlib only)
        run: |
          python scripts/verify_evidence.py
          python -m unittest discover -s tests -p test_evidence.py
          python -m unittest discover -s tests -p test_arc_eval.py
          python -m unittest discover -s tests -p test_gguf_inspection.py
          python -m unittest discover -s tests -p test_artifact_audit.py
          python -m unittest discover -b -s tests -p test_export_preflight.py
          python -m unittest discover -s tests -p test_algebra_reference.py
      - name: Install CPU-only operator dependency
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Bounded operator checks (no model or dataset downloads)
        run: |
          python -m unittest discover -s tests -p test_geometry.py
          python -m unittest discover -s tests -p test_ig.py
          python -m unittest discover -b -s tests -p test_checkpoint.py
          python -m unittest discover -b -s tests -p test_projection_display.py
          python -m unittest discover -b -s tests -p test_poincare_transport.py
          python -m unittest discover -b -s tests -p test_legacy_geometric_adapter.py
          python scripts/transport_reference.py
      - name: Install small plotting test dependencies
        run: python -m pip install numpy==1.26.4 matplotlib==3.9.4 pillow==11.1.0 "gradio>=5.0,<6.0"
      - name: Descriptive telemetry and plot contracts (no model loading)
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -b -s tests -p test_demo_evidence.py
      - name: Install pinned HF test dependencies
        run: python -m pip install -r requirements-test-hf.txt
      - name: Tiny real HF integration
        run: python -m unittest discover -b -s tests -p test_tiny_hf_integration.py
      - name: Build pinned CPU-only native GGUF check
        run: |
          git init "$RUNNER_TEMP/native-source"
          git -C "$RUNNER_TEMP/native-source" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/native-source" fetch --depth 1 origin 067b8d7af3f4775b1ad39470d1860696a8a7b3a3
          git -C "$RUNNER_TEMP/native-source" checkout --detach FETCH_HEAD
          cmake -S tests/native -B "$RUNNER_TEMP/native-build" \
            -DLLAMA_CPP_SOURCE="$RUNNER_TEMP/native-source" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_HTTPLIB=OFF
          cmake --build "$RUNNER_TEMP/native-build" --target native-qwen2 --parallel 2
      - name: Tiny native GGUF logits and rejection
        env:
          IGBUNDLE_NATIVE_QWEN2_BINARY: ${{ runner.temp }}/native-build/bin/native-qwen2
        run: python -m unittest discover -v -s tests -p test_tiny_gguf_runtime.py
