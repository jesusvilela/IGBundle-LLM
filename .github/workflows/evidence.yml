name: Bounded evidence checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      DISABLE_TORCHAO: "1"
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evidence arithmetic and scoring contracts (stdlib only)
        run: |
          python scripts/verify_evidence.py
          python -m unittest discover -s tests -p test_evidence.py
          python -m unittest discover -s tests -p test_arc_eval.py
          python -m unittest discover -s tests -p test_gguf_inspection.py
          python -m unittest discover -s tests -p test_artifact_audit.py
          python -m unittest discover -b -s tests -p test_export_preflight.py
          python -m unittest discover -s tests -p test_algebra_reference.py
      - name: Install CPU-only operator dependency
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Bounded operator checks (no model or dataset downloads)
        run: |
          python -m unittest discover -s tests -p test_geometry.py
          python -m unittest discover -s tests -p test_ig.py
          python -m unittest discover -b -s tests -p test_checkpoint.py
          python -m unittest discover -b -s tests -p test_projection_display.py
      - name: Install small plotting test dependencies
        run: python -m pip install numpy==1.26.4 matplotlib==3.9.4 pillow==11.1.0 "gradio>=5.0,<6.0"
      - name: Descriptive telemetry and plot contracts (no model loading)
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -b -s tests -p test_demo_evidence.py
      - name: Install pinned HF test dependencies
        run: python -m pip install -r requirements-test-hf.txt
      - name: Tiny real HF integration
        run: python -m unittest discover -b -s tests -p test_tiny_hf_integration.py
